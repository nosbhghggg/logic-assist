name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (optional, uses default if empty)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build universal JAR
        run: chmod +x gradlew && ./gradlew deploy

      - name: Prepare release info
        id: info
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          # 确定版本号和 tag：tag 触发用 ref_name，workflow_dispatch 读 mod.hjson
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep '^version:' mod.hjson | sed 's/version:[ ]*//' | tr -d '"' | tr -d "'")
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

          # 确定 release notes：优先用输入，否则默认
          if [ -n "$INPUT_NOTES" ]; then
            printf '%s' "$INPUT_NOTES" > /tmp/release_body.md
          else
            {
              echo 'Universal JAR for desktop and Android.'
              echo ''
              echo '<details>'
              echo '<summary>English</summary>'
              echo ''
              echo '### New Features'
              echo '- Added more settings: jump color mode, scrollbar mode, and hover-expand ratio'
              echo ''
              echo '### Improvements'
              echo '- Optimized JUMP button display across different screen states: compact mode uses line-number jump buttons, narrow-strip mode uses block-internal JUMP button'
              echo '- Smooth scroll transition animation when jumping to target blocks'
              echo ''
              echo '</details>'
              echo ''
              echo '<details>'
              echo '<summary>中文</summary>'
              echo ''
              echo '### 新功能'
              echo '- 添加更多设置项：跳转行着色模式、滚动条模式、悬浮跳变粗倍率'
              echo ''
              echo '### 优化'
              echo '- 优化 jump 跳转按钮在不同屏幕状态下的显示：紧凑模式使用行号跳转按钮，细长条模式使用积木内 JUMP 按钮'
              echo '- 跳转到目标积木时使用平滑滚动过渡动画'
              echo ''
              echo '</details>'
            } > /tmp/release_body.md
          fi
          echo "Release notes:" && cat /tmp/release_body.md

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.info.outputs.tag }}" \
            | jq -r '.id // empty')
          if [ -n "$release_id" ]; then
            curl -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$release_id"
            echo "Deleted release $release_id"
          else
            echo "No existing release"
          fi

      - name: Update or create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.info.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            # tag 已存在 → 覆盖更新（强制更新到当前 commit）
            git tag -f "$TAG" ${{ github.sha }}
            git push -f origin "$TAG"
            echo "Updated tag $TAG"
          else
            # tag 不存在 → 新建
            git tag "$TAG" ${{ github.sha }}
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(jq -Rs . < /tmp/release_body.md)
          response=$(curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${{ steps.info.outputs.tag }}\",\"name\":\"${{ steps.info.outputs.tag }}\",\"body\":$BODY,\"draft\":false,\"prerelease\":false}" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          upload_url=$(echo "$response" | jq -r '.upload_url' | sed 's/{?name,label}//')
          release_id=$(echo "$response" | jq -r '.id')
          echo "Created release $release_id"
          curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/java-archive" \
            --data-binary @build/libs/logic-assist.jar \
            "${upload_url}?name=logic-assist.jar"
          echo "Uploaded asset"
