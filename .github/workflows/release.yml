name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Build universal JAR
        run: chmod +x gradlew && ./gradlew deploy
      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | jq -r '.id // empty')
          if [ -n "$release_id" ]; then
            curl -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$release_id"
            echo "Deleted release $release_id"
          else
            echo "No existing release"
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/logic-assist.jar
          name: ${{ github.ref_name }} - Universal Release
          body: Universal JAR for desktop and Android.
