name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Build universal JAR
        run: chmod +x gradlew && ./gradlew deploy
      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | jq -r '.id // empty')
          if [ -n "$release_id" ]; then
            curl -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$release_id"
            echo "Deleted release $release_id"
          else
            echo "No existing release"
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${{ github.ref_name }}\",\"name\":\"${{ github.ref_name }} - Universal Release\",\"body\":\"Universal JAR for desktop and Android.\",\"draft\":false,\"prerelease\":false}" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          upload_url=$(echo "$response" | jq -r '.upload_url' | sed 's/{?name,label}//')
          release_id=$(echo "$response" | jq -r '.id')
          echo "Created release $release_id"
          curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/java-archive" \
            --data-binary @build/libs/logic-assist.jar \
            "${upload_url}?name=logic-assist.jar"
          echo "Uploaded asset"
